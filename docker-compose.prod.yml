services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skillfit-backend-prod
    ports:                                    # ADD THIS
      - "8000:8000"                           # ADD THIS
    expose:
      - "8000"
    volumes:
      - data_volume:/app/data
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s                       # ADD THIS for model loading

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skillfit-frontend-prod
    ports:                                    # ADD THIS
      - "8501:8501"                           # ADD THIS
    expose:
      - "8501"
    environment:
      - API_URL=http://backend:8000
      - ENVIRONMENT=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: skillfit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  data_volume: